<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories - Kanwal</title>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/confetti-generator@1.0.0/dist/confetti.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            color: #333; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 30px 20px; overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .container {
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px);
            max-width: 950px; width: 100%; padding: 40px;
            border-radius: 25px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .navbar {
            display: flex; justify-content: center; gap: 15px;
            margin-bottom: 25px; border-bottom: 2px solid rgba(214, 51, 132, 0.2);
            padding-bottom: 15px;
        }
        .navbar a {
            text-navigation: none; color: #555; font-weight: 600;
            padding: 8px 18px; border-radius: 20px; transition: all 0.3s ease;
            font-size: 0.9rem; background: rgba(255,255,255,0.6); text-decoration: none;
        }
        .navbar a:hover, .navbar a.active {
            background: #d63384; color: white; box-shadow: 0 4px 10px rgba(214,51,132,0.3);
        }
        header h1 { font-family: 'Sacramento', cursive; font-size: 3.5rem; color: #d63384; margin-bottom: 5px; }
        .subtitle { font-size: 1.1rem; color: #555; margin-bottom: 25px; font-weight: 300; }
        
        /* Gallery Grid Layout */
        .gallery-grid {
            display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px;
        }
        .photo-card {
            background: #fff; padding: 10px 10px 15px 10px; border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12); transition: transform 0.3s ease;
        }
        .photo-card:hover { transform: scale(1.06); z-index: 20; }
        .photo-card img {
            width: 160px; height: 160px; object-fit: cover; border-radius: 5px; display: block;
        }
        .photo-card p {
            font-family: 'Sacramento', cursive; font-size: 1.3rem; color: #d63384; margin-top: 8px;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div class="container">
        <!-- Navigation Menu -->
        <nav class="navbar">
            <a href="index.html">Home 🏠</a>
            <a href="wish.html">Special Wish ✨</a>
            <a href="gallery.html" class="active">Memories 📸</a>
        </nav>

        <header>
            <h1>Our Beautiful Memories 🌟</h1>
            <p class="subtitle">All the wonderful moments we shared...</p>
        </header>

        <!-- Gallery Section with All Photos -->
        <div class="gallery-grid">
            <div class="photo-card">
                <img src="images/photo2.jpg" alt="Memory">
                <p>Pyari Yaadein</p>
            </div>
            <div class="photo-card">
                <img src="images/photo3.jpg" alt="Memory">
                <p>Best Moments</p>
            </div>
            <div class="photo-card">
                <img src="images/image5.jpg" alt="Memory">
                <p>Special Day</p>
            </div>
            <div class="photo-card">
                <img src="images/image6.jpg" alt="Memory">
                <p>Sweet Smiles</p>
            </div>
            <div class="photo-card">
                <img src="images/image7.jpg" alt="Memory">
                <p>Beautiful You</p>
            </div>
            <div class="photo-card">
                <img src="images/image8.jpg" alt="Memory">
                <p>Forever Dosti</p>
            </div>
            <div class="photo-card">
                <img src="images/image9.jpg" alt="Memory">
                <p>Joyful Times</p>
            </div>
            <div class="photo-card">
                <img src="images/image10.jpg" alt="Memory">
                <p>Sweet Memories</p>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const confettiSettings = { target: 'confetti-canvas', max: 80, respawn: true, fps: 30 };
            const confetti = new ConfettiGenerator(confettiSettings);
            confetti.render();
        };
    </script>
</body>
</html>
